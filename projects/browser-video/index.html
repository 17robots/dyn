<!doctype html>
<meta charset="utf-8">
<title>Dyn + FFmpeg browser video</title>
<style>body{font:18px system-ui;max-width:720px;margin:3rem auto}video{width:100%;max-height:400px}button,input{margin:1rem 0;padding:.5rem}pre{white-space:pre-wrap}</style>
<h1>Video processing with Dyn</h1>
<p>Choose a video up to 16 MiB. FFmpeg decodes up to one second at 160×90, Dyn applies grayscale, and FFmpeg exports a silent WebM. Processing stays in your browser.</p>
<input id="file" type="file" accept="video/*">
<button id="convert">Create grayscale clip</button>
<button id="cancel" disabled>Cancel</button>
<pre id="status">Ready. First run loads the locally served FFmpeg core.</pre>
<video controls></video>
<a id="download" hidden download="dyn-grayscale.webm">Download clip</a>
<script type="module" src="main.js"></script>
