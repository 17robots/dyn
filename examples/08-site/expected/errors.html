<h1>Failure is state</h1>
<p><a href="index.html">All pages</a></p>
<p>A call that can fail takes a status. The first failure stays there, and
every later call given that status does nothing, so you check it once,
before you act on the results.</p>
<p>A broken invariant is different: that is a bug, and the program panics.</p>
