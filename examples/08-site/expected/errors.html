<h1>Errors are values</h1>
<p><a href="index.html">All pages</a></p>
<p>A call that can fail returns {value, failure}. The value is always safe to
read, so a failure you ignore gives you an empty result, not a crash.</p>
<p>A broken invariant is different: that is a bug, and the program panics.</p>
