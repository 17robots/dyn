projects:
- example:
  version: 0.1.0
  type: executable
  src: /src/main.dyn
  use:
  - http: 0.0.1
  - bignum:
    src: github.com/link/here.git
    version: 0.0.1
  - cli:
    src: somegitrepo
    version: 1.0
    branch: nightly
  - exampleLib:
    entry: projects.exampleLib
    version: 1.0
  config:
    debug:
    - optimize: 3
    release:
    - optimize: 5
    shared:
    - outdir: bin/example
    - moduledir: example/vendor
- exampleLib:
  version: 1.0
  type: library
  entry: lib1/src/main.dyn
  config:
    debug:
    - optimize: 3
    release:
    - optimize: 5
    shared:
    - outdir: lib/example
