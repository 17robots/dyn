[package]
name = "dyn_compiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dyn"
path = "src/main.rs"

[dependencies]
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-module = "0.116"
cranelift-native = "0.116"
cranelift-object = "0.116"
object = { version = "0.36", features = ["read", "write"] }
