name: Setup standalone compiler
description: Install C tools, optional format-validation tools, and vendor-test dependencies
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # The runner's Azure mirror has stalled until the entire job times out.
        # Keep Ubuntu's signed repositories, using the standard HTTPS archive.
        apt_sources=(/etc/apt/sources.list.d/ubuntu.sources)
        # Hosted images may put the archive URL in an indirect mirror list.
        if test -f /etc/apt/apt-mirrors.txt; then
          apt_sources+=(/etc/apt/apt-mirrors.txt)
        fi
        sudo sed -i -e 's/^Types: deb$/Types: deb deb-src/' \
          -e 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
          "${apt_sources[@]}"
        apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install -y build-essential python3 clang-19 llvm-19 lld-19 patchelf
        echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
        tool_root=$(mktemp -d)
        git clone --depth 1 --branch v0.25.8 https://github.com/tree-sitter/tree-sitter "$tool_root/tree-sitter"
        test "$(git -C "$tool_root/tree-sitter" rev-parse HEAD)" = f2f197b6b27ce75c280c20f131d4f71e906b86f7
        sudo make -C "$tool_root/tree-sitter" install PREFIX=/usr/local
        sudo ldconfig
        curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$tool_root/zig.tar.xz"
        echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $tool_root/zig.tar.xz" | sha256sum -c -
        tar -xf "$tool_root/zig.tar.xz" -C "$tool_root"
        echo "$tool_root/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
        cargo install just --version 1.58.0 --locked
