name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Full
            os: ubuntu-latest
            full: true
          - name: macOS Frontend
            os: macos-latest
            full: false
          - name: Windows Frontend
            os: windows-latest
            full: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        if: matrix.full == true
        shell: bash
        run: cargo fmt --all -- --check

      - name: Full Test Suite
        if: matrix.full == true
        shell: bash
        run: cargo test

      - name: Frontend/Typecheck Tests
        if: matrix.full != true
        shell: bash
        run: |
          cargo test compiler::module_resolver::tests::
          cargo test compiler::lexer::scanner::tests::
          cargo test compiler::parser::tests::
          cargo test compiler::sema::analyze::tests::
          cargo test compiler::sema::typeck::tests::
          cargo test compiler::mir::verify::tests::
          cargo test compiler::backend::cranelift::tests::
