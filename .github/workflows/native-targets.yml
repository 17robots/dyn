name: Native target tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 0.1.0-dev


permissions:
  contents: read

concurrency:
  group: native-targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DYN_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}

jobs:
  build-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLVM_CONFIG: llvm-config-19
      CLANG: clang-19
      DYN: ./build/dyn-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-compiler
      - name: Build compiler and target probes
        run: |
          just release
          python3 tools/build-native-probes.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-target-probes
          path: build/native-target-probes/
          if-no-files-found: error
          retention-days: 14

  execute:
    needs: build-probes
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-2022
          - target: macos
            runner: macos-15
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-target-probes
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Execute debug and release probes
        shell: bash
        run: python run-native-artifacts.py --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}-evidence
          path: native-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
