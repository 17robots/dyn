name: Mise installation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p build/mise-check && cp mise.example.toml build/mise-check/mise.toml
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.9'
          working_directory: build/mise-check
          cache: false
      - name: Compile using mise-installed preview
        working-directory: build/mise-check
        run: |
          mise exec -- dyn version
          mise exec -- dyn build ../../tests/smoke --release --no-cache --quiet --output smoke${{ runner.os == 'Windows' && '.exe' || '' }}
          ./smoke${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Test release assembly rejection paths
        run: python3 tests/release-bundle.py
