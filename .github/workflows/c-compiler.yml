name: C compiler
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 0.1.0-dev
permissions:
  contents: read
env:
  DYN_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_CONFIG: llvm-config-19
      CLANG: clang-19
      DYN: ./build/dyn-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-compiler
      - run: just release-check
      - name: Differential expression parser experiment
        run: just test-parser-experiment
      - name: Qualify compact declaration consumer
        run: just test-compact-declarations
      - name: Qualify retained compact source consumers
        run: just test-compact-sources
      - name: Qualify direct compact AST lowering
        run: just test-compact-ast
      - name: Qualify compact-first validation
        run: just test-compact-first
      - name: Paired compiler equivalence and provenance
        run: python3 tools/compare-compilers.py --candidate build/dyn-compact-sources --lines 1000 --flat 10 --runs 1 --output build/compiler-paired-smoke
      - name: Differential scalar backend experiment
        run: just test-backend-experiment
      - name: Native debug compiler integration
        run: just test-native-debug
      - name: Qualify native vendor wrappers and generated bindings
        env:
          BIND_CLANG: clang-19
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev libpcre2-dev libsqlite3-dev liblz4-dev libzstd-dev
          just test-vendors-native
      - run: python3 tests/compiler-host.py
      - name: Exercise editor navigation with a small stack
        run: |
          ulimit -s 1024
          python3 tests/lsp-navigation.py
      - name: SDK without system LLVM or Tree-sitter
        run: bash tests/package-container.sh "build/dist/dyn-$DYN_VERSION-linux-x86_64.tar.gz" "$DYN_VERSION"
      - name: Compiler contracts under sanitizers
        env:
          DYN: ./build/dyn-sanitize
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          just artifact dyn-sanitize
          python3 tests/compiler-contracts.py
          python3 tests/generics.py
          python3 tools/parser-experiment/check.py --sanitize --samples 100
          python3 tools/parser-experiment/check-declarations.py --sanitize
          python3 tools/parser-experiment/check-sources.py --sanitize
          python3 tools/parser-experiment/check-ast.py --sanitize --corpus std --corpus tests
          python3 tools/parser-experiment/check-depth.py --sanitize --corpus std --corpus tests
          python3 tools/parser-experiment/check-first.py --sanitize
          python3 tools/parser-experiment/check-scopes.py --sanitize
          python3 tools/parser-experiment/check-refs.py --sanitize
          python3 tools/parser-experiment/check-rewrite.py --sanitize
          python3 tools/parser-experiment/check-interfaces.py --sanitize
          BUILD=build/backend-sanitize CFLAGS='-O1 -fsanitize=address,undefined -fno-omit-frame-pointer' python3 tools/backend-experiment/build.py
          BUILD=build/backend-sanitize DYN=./build/dyn-release python3 tools/backend-experiment/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: |
            build/release-check/
            build/readiness/
            build/compact-first-acceptance.*/run/
            build/dist/
