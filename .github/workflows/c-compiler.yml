name: C compiler
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 0.1.0-dev
permissions:
  contents: read
env:
  DYN_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_CONFIG: llvm-config-19
      CLANG: clang-19
      DYN: ./build/dyn-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-compiler
      - run: just release-check
      - name: SDK without system LLVM or Tree-sitter
        run: bash tests/package-container.sh "build/dist/dyn-$DYN_VERSION-linux-x86_64.tar.gz" "$DYN_VERSION"
      - name: Compiler contracts under sanitizers
        env:
          DYN: ./build/dyn-sanitize
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          just artifact dyn-sanitize
          python3 tests/compiler-contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: |
            build/release-check/
            build/readiness/
            build/dist/
