name: C compiler
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: 0.1.0-dev
permissions:
  contents: read
env:
  DYN_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}
jobs:
  no-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and exercise the compiler without LLVM
        run: python3 tests/no-llvm.py
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLANG: clang-19
      DYN: ./build/dyn-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: just release-check
      - name: Check ARM64 COFF relocations and import thunks under sanitizers
        run: python3 tests/arm64-coff.py
      - name: Check Mach-O x64 relocation addends under sanitizers
        env:
          CC: clang-19 -fsanitize=address,undefined -fno-sanitize-recover=all
        run: python3 tests/macho-relocations.py
      - name: Differential scalar backend experiment
        run: just test-backend-experiment
      - name: Native debug compiler integration
        run: just test-native-debug
      - name: Qualify native vendor wrappers and generated bindings
        env:
          BIND_CLANG: clang-19
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev libpcre2-dev libsqlite3-dev liblz4-dev libzstd-dev
          just test-vendors-native
      - run: python3 tests/compiler-host.py
      - name: Exercise editor navigation with a small stack
        run: |
          ulimit -s 1024
          python3 tests/lsp-navigation.py
      - name: SDK without system LLVM
        run: bash tests/package-container.sh "build/dist/dyn-$DYN_VERSION-linux-x86_64.tar.gz" "$DYN_VERSION"
      - name: Compiler contracts under sanitizers
        env:
          DYN: ./build/dyn-sanitize
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          just artifact dyn-sanitize
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/llvm-text-unit.c -o build/llvm-text-unit-sanitize
          ./build/llvm-text-unit-sanitize
          python3 tests/compiler-contracts.py
          python3 tests/generics.py
          python3 tests/native-optimization.py
          python3 tests/native-machine-optimization.py
          python3 tests/runtime-support.py
          for unit in parser-recovery parser-unit parser-snapshot; do
            cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -D_POSIX_C_SOURCE=200809L \
              -Isrc tests/$unit.c $([ $unit = parser-recovery ] && echo src/parser.c src/snapshot.c) -pthread -o build/$unit-sanitize
            ./build/$unit-sanitize
          done
          BUILD=build/backend-sanitize CFLAGS='-O1 -fsanitize=address,undefined -fno-omit-frame-pointer' python3 tools/backend-experiment/build.py
          BUILD=build/backend-sanitize DYN=./build/dyn-release python3 tools/backend-experiment/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: |
            build/release-check/
            build/readiness/
            build/dist/
