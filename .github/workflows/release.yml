name: Release SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for validation only; manual runs never publish'
        required: true
        default: '0.1.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['REF'].removeprefix('v') if os.environ['EVENT'] == 'push' else os.environ['REQUESTED_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', value):
              raise SystemExit('Invalid release version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value='+value+'\n')
          PY
  linux:
    needs: version
    uses: ./.github/workflows/c-compiler.yml
    with:
      release_version: ${{ needs.version.outputs.value }}
  native:
    needs: version
    uses: ./.github/workflows/native-targets.yml
    with:
      release_version: ${{ needs.version.outputs.value }}
  compiler-hosts:
    needs: version
    uses: ./.github/workflows/compiler-hosts.yml
    with:
      release_version: ${{ needs.version.outputs.value }}
  bundle:
    needs: [version, linux, native, compiler-hosts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-readiness
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-evidence
          path: native-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: host-evidence
          merge-multiple: true
      - name: Verify evidence and assemble release
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: python3 tools/prepare-release.py --version "$VERSION" --evidence evidence --native native-evidence --hosts host-evidence --output release
      - name: Verify SDK on clean Ubuntu and Arch Linux
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: bash tests/package-container.sh "release/public/dyn-$VERSION-linux-x86_64-glibc2.39.tar.gz" "$VERSION"
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.9'
          install: false
          cache: false
      - name: Verify mise installation before publication
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: python3 tests/mise-package.py "release/public/dyn-$VERSION-linux-x86_64-glibc2.39.tar.gz" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish validated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --title "Dyn $TAG" --notes-file RELEASE-NOTES.md "${flags[@]}" public/*
