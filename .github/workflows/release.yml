name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: cargo build --release

      - name: Package release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          os_tag="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          ref_tag="${GITHUB_REF_NAME:-manual}"
          bin_name="dyn_compiler"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bin_name="dyn_compiler.exe"
            archive="dyn_compiler-${ref_tag}-${os_tag}.zip"
            7z a "${archive}" "target/release/${bin_name}"
          else
            archive="dyn_compiler-${ref_tag}-${os_tag}.tar.gz"
            tar -czf "${archive}" -C target/release "${bin_name}"
          fi
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
