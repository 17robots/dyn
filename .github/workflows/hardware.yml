name: Native graphics qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: [self-hosted, linux, x64, dyn-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: just release
      - name: Execute real SDL GPU and audio lifecycle checks
        run: DYN="$PWD/build/dyn-release" python3 tests/sdl3-applications.py --gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-evidence
          path: build/readiness/sdl-applications.json
